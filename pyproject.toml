[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conscious"
version = "0.1.0"
description = "A model whose learning and reasoning are driven by pain and desire"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
conscious = "conscious.chat:main"

[tool.setuptools]
packages = ["conscious"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
